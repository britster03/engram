{% extends "base.html" %}

{% block title %}Chat - Engram Admin{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ static('css/dashboard.css') }}">
{% endblock %}

{% block content %}
<div class="min-h-screen bg-white flex flex-col overflow-x-hidden" x-data="chat()" data-theme="light">
  {% include "dashboard/_navbar.html" %}

  <main class="flex-grow relative overflow-hidden">
    <div class="absolute inset-0 bg-grain pointer-events-none z-0"></div>
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-10 relative z-10 h-full flex flex-col">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
        <div class="min-w-0">
          <h2 class="text-xs font-bold uppercase tracking-widest text-neutral-400 mb-1">Session</h2>
          <div class="flex flex-wrap items-center gap-2 sm:gap-3">
            <h3 class="text-2xl font-bold tracking-tight text-neutral-900">Memory Query</h3>
            <span x-show="sessionId" class="text-xs font-mono text-neutral-400" x-text="sessionId ? sessionId.slice(0,8)+'...' : ''"></span>
          </div>
        </div>
        <button @click="newSession()" type="button" class="w-full sm:w-auto px-4 py-2 bg-white border border-neutral-200 hover:bg-neutral-50 text-neutral-900 text-sm font-semibold rounded-xl transition-all">
          New Session
        </button>
      </div>

      <div class="flex-1 bg-white rounded-2xl border border-neutral-200 shadow-sm flex flex-col overflow-hidden" style="min-height: 400px;">
        <div class="flex-1 overflow-y-auto p-4 space-y-4" id="chat-history" x-ref="history">
          <template x-for="msg in messages" :key="msg.id">
            <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'">
              <div :class="msg.role === 'user' ? 'bg-neutral-900 text-white rounded-2xl rounded-tr-sm' : 'bg-neutral-100 text-neutral-900 rounded-2xl rounded-tl-sm'" class="max-w-[88%] sm:max-w-[80%] px-4 py-3 text-sm leading-relaxed">
                <template x-if="msg.role === 'assistant' && (msg.retrievalSteps.length > 0 || msg.loading)">
                  <details class="mb-2 group" open>
                    <summary class="flex items-center gap-1.5 cursor-pointer text-xs font-medium text-neutral-500 hover:text-neutral-700 select-none">
                      <svg class="w-3 h-3 transition-transform group-open:rotate-90" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                      <span x-text="msg.loading ? 'Retrieving...' : 'Retrieval trace'"></span>
                      <span x-show="!msg.loading && msg.retrievalSteps.length > 0" class="text-neutral-400" x-text="'(' + msg.retrievalSteps.length + ' step' + (msg.retrievalSteps.length > 1 ? 's' : '') + ')'"></span>
                    </summary>
                    <div class="mt-1.5 space-y-1 text-xs font-mono text-neutral-500">
                      <template x-for="(step, si) in msg.retrievalSteps" :key="si">
                        <div class="flex items-center gap-2 py-0.5">
                          <span class="inline-block w-1.5 h-1.5 rounded-full" :class="stepColor(step.step)"></span>
                          <span class="font-semibold text-neutral-700" x-text="stepLabel(step.step)"></span>
                          <span x-show="step.cascade_depth_reached" class="text-neutral-400" x-text="'depth=' + step.cascade_depth_reached"></span>
                          <span x-show="step.nodes_retrieved !== undefined" class="text-neutral-400" x-text="step.nodes_retrieved + ' nodes'"></span>
                          <span x-show="step.latency_ms" class="text-neutral-400" x-text="formatStepLatency(step)"></span>
                          <span x-show="step.l0_decision" class="text-neutral-400" x-text="'L0=' + step.l0_decision"></span>
                          <span x-show="step.reentries > 0" class="text-amber-500" x-text="'re-entry #' + step.reentries"></span>
                        </div>
                      </template>
                    </div>
                  </details>
                </template>
                <p x-html="purify(msg.content)"></p>
              </div>
            </div>
          </template>
          <div x-show="loading && !messages.some(m => m.role === 'assistant' && m.loading)" class="flex justify-start">
            <div class="bg-neutral-100 text-neutral-900 rounded-2xl rounded-tl-sm px-4 py-3 text-sm flex items-center gap-2">
              <div class="w-4 h-4 border-2 border-neutral-300 border-t-neutral-900 rounded-full animate-spin"></div>
              Thinking...
            </div>
          </div>
        </div>

        <div class="border-t border-neutral-200 p-4">
          <form @submit.prevent="send()" class="flex gap-2">
            <input x-model="input" type="text" class="chat-input flex-1 px-4 py-2.5 rounded-xl border border-neutral-200 bg-white text-sm placeholder-neutral-400 focus:border-neutral-900 transition-all" placeholder="Ask Engram about a session or memory..." required>
            <button type="submit" class="shrink-0 px-3 sm:px-5 py-2.5 bg-neutral-900 hover:bg-neutral-800 text-white text-sm font-semibold rounded-xl transition-all flex items-center gap-2">
              <i data-lucide="send" class="w-4 h-4"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/admin/static/js/purify.min.js"></script>
<script>
function purify(raw) {
  if (!raw) return '';
  return (window.DOMPurify && DOMPurify.sanitize) ? DOMPurify.sanitize(raw, { ALLOWED_TAGS: ['b','i','em','strong','code','pre','a','ul','ol','li','p','br'], ALLOWED_ATTR: ['href'] }) : raw.replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function chat() {
  return {
    messages: [],
    input: '',
    loading: false,
    streamAbort: null,
    sessionId: null,
    _msgId: 0,
    _nextId() { return ++this._msgId; },
    mainTab: 'chat',
    _authHeaders() {
      var h = {};
      var t = localStorage.getItem('engram_api_key');
      if (t) h['Authorization'] = 'Bearer ' + t;
      return h;
    },
    stepColor(step) {
      var name = String(step || '');
      if (name.includes('frontier')) return 'bg-sky-500';
      if (name.includes('msc')) return 'bg-violet-500';
      if (name.includes('l0')) return 'bg-neutral-500';
      if (name.includes('l1')) return 'bg-emerald-500';
      if (name.includes('l2') || name.includes('l3') || name.includes('l4')) return 'bg-amber-500';
      return 'bg-neutral-400';
    },
    stepLabel(step) {
      var name = String(step || '');
      return name
        .replace(/_/g, ' ')
        .replace(/\b\w/g, function (ch) { return ch.toUpperCase(); });
    },
    formatStepLatency(step) {
      var latency = (step && step.latency_ms) || {};
      var value = latency[step.step];
      if (value === undefined || value === null) return '';
      if (value >= 1000) return (value / 1000).toFixed(1) + 's';
      return Math.round(value) + 'ms';
    },
    setMainTab(tab) { if (tab !== 'chat') window.location.href = '/admin/dashboard?tab=' + tab; },
    logout() {
      document.cookie = 'engram_session_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT;';
      localStorage.removeItem('engram_api_key');
      window.location.href = '/admin/login';
    },
    async init() {
      var stored = localStorage.getItem('engram_chat_session_id');
      if (stored) {
        this.sessionId = stored;
      } else {
        try {
          const r = await fetch('/admin/api/sessions', { method: 'POST', headers: this._authHeaders() });
          if (r.ok) {
            const obj = await r.json();
            if (obj.session_id) {
              this.sessionId = obj.session_id;
              localStorage.setItem('engram_chat_session_id', this.sessionId);
            }
          }
        } catch (_) {}
      }
      this.messages.push({id: this._nextId(), role: 'assistant', content: 'Hello. I am the Engram admin assistant. Ask me about sessions, memories, or system status.', retrievalSteps: [], loading: false});
    },
    async newSession() {
      try {
        const r = await fetch('/admin/api/sessions', { method: 'POST', headers: this._authHeaders() });
        if (r.ok) {
          const obj = await r.json();
          if (obj.session_id) {
            this.sessionId = obj.session_id;
            localStorage.setItem('engram_chat_session_id', this.sessionId);
            this.messages = [];
            this.messages.push({id: this._nextId(), role: 'assistant', content: 'Hello. I am the Engram admin assistant. Ask me about sessions, memories, or system status.', retrievalSteps: [], loading: false});
          }
        }
      } catch (_) {}
    },
    async send() {
      if (!this.input.trim()) return;
      const userMsg = {id: this._nextId(), role: 'user', content: this.input};
      this.messages.push(userMsg);
      this.input = '';
      this.loading = true;
      const scroll = () => { this.$nextTick(() => { this.$refs.history.scrollTop = this.$refs.history.scrollHeight; }); };
      scroll();

      try {
        const ctrl = new AbortController();
        this.streamAbort = ctrl;
        const resp = await fetch('/admin/api/chat/completions', {
          method: 'POST',
          headers: {
            ...this._authHeaders(),
            'Content-Type': 'application/json',
            'Accept': 'text/event-stream'
          },
          body: JSON.stringify({messages: this.messages, session_id: this.sessionId, stream: true}),
          signal: ctrl.signal
        });
        if (!resp.ok) {
          const text = await resp.text();
          throw new Error('HTTP ' + resp.status + ': ' + text);
        }

        this.messages.push({id: this._nextId(), role: 'assistant', content: '', retrievalSteps: [], loading: true});
        const assistantIdx = this.messages.length - 1;

        const contentType = resp.headers.get('content-type') || '';
        if (!contentType.includes('text/event-stream')) {
          const obj = await resp.json();
          this.messages[assistantIdx].content = String(obj.answer || obj.response || JSON.stringify(obj));
          if (obj.retrieval_metadata) {
            this.messages[assistantIdx].retrievalSteps = this._stepsFromMetadata(obj.retrieval_metadata);
          }
          this.messages[assistantIdx].loading = false;
          this.messages = [...this.messages];
          this.loading = false;
          this.streamAbort = null;
          scroll();
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, {stream: true});
          let eventName = '';
          let data = '';
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            if (line.startsWith('event:')) {
              eventName = line.replace(/^event:\s*/, '');
            } else if (line.startsWith('data:')) {
              data = line.replace(/^data:\s*/, '');
            } else if (line.trim() === '') {
              if (eventName === 'retrieval_step' && data) {
                try {
                  const step = JSON.parse(data);
                  this.messages[assistantIdx].retrievalSteps = [...this.messages[assistantIdx].retrievalSteps, step];
                  this.messages = [...this.messages];
                  scroll();
                } catch (_) {}
              }
              if (eventName === 'metadata' && data) {
                try {
                  const md = JSON.parse(data);
                  this.messages[assistantIdx].retrievalSteps = this._stepsFromMetadata(md);
                  this.messages = [...this.messages];
                } catch (_) {}
              }
              if (eventName === 'delta' && data) {
                try {
                  const obj = JSON.parse(data);
                  if (typeof obj.text === 'string') this.messages[assistantIdx].content += obj.text;
                  if (typeof obj.content === 'string') this.messages[assistantIdx].content += obj.content;
                  this.messages = [...this.messages];
                  this.$nextTick(() => { this.$refs.history.scrollTop = this.$refs.history.scrollHeight; });
                } catch (_) {}
              }
              if (eventName === 'done') {
                this.messages[assistantIdx].loading = false;
                this.messages = [...this.messages];
                this.loading = false;
                this.streamAbort = null;
                scroll();
                return;
              }
              if (eventName === 'error') {
                throw new Error(data || 'Stream error');
              }
              eventName = '';
              data = '';
            }
          }
        }

      } catch (e) {
        if (e.name !== 'AbortError') {
          const lastMsg = this.messages[this.messages.length - 1];
          if (lastMsg && lastMsg.role === 'assistant' && lastMsg.content === '') {
            this.messages[this.messages.length - 1].content = 'Error: ' + e.message;
            this.messages[this.messages.length - 1].loading = false;
          } else {
            this.messages.push({id: this._nextId(), role: 'assistant', content: 'Error: ' + e.message, retrievalSteps: [], loading: false});
          }
          this.messages = [...this.messages];
        }
      }
      this.loading = false;
      this.streamAbort = null;
      scroll();
    },
    _stepsFromMetadata(md) {
      var steps = [];
      var latency = md.latency_ms || {};
      var levels = md.levels_visited || [];
      for (var i = 0; i < levels.length; i++) {
        var lvl = levels[i];
        var planKey = lvl.toLowerCase() + '_plan';
        var execKey = lvl.toLowerCase() + '_execute';
        if (latency[planKey] !== undefined || latency[execKey] !== undefined) {
          steps.push({
            step: planKey,
            cascade_depth_reached: lvl,
            nodes_retrieved: md.nodes_retrieved,
            latency_ms: latency,
            l0_decision: md.l0_decision,
            l0_reason: md.l0_reason,
            reentries: md.reentries || 0,
          });
        }
        if (latency[execKey] !== undefined) {
          steps.push({
            step: execKey,
            cascade_depth_reached: lvl,
            nodes_retrieved: md.nodes_retrieved,
            latency_ms: latency,
            l0_decision: md.l0_decision,
            l0_reason: md.l0_reason,
            reentries: md.reentries || 0,
          });
        }
      }
      if (latency['msc_assembly'] !== undefined) {
        steps.push({
          step: 'msc_assembly',
          cascade_depth_reached: md.cascade_depth_reached,
          nodes_retrieved: md.nodes_retrieved,
          latency_ms: latency,
          total_context_tokens: md.total_context_tokens,
          reentries: md.reentries || 0,
        });
      }
      for (var k in latency) {
        if (k.startsWith('frontier_answer')) {
          steps.push({
            step: k,
            cascade_depth_reached: md.cascade_depth_reached,
            latency_ms: latency,
            reentries: md.reentries || 0,
          });
        }
      }
      return steps;
    }
  }
}
</script>
{% endblock %}
