# Controlled vocabulary for RELATES_TO edge labels (§6.4.2).
# The NORMALIZE task maps extracted relation strings to the nearest
# canonical form by cosine similarity against these labels; extracted
# labels that fail to match above 0.85 are preserved verbatim and flagged
# for manual review via /api/v1/consolidation/status.

version: 5
relations:
  # Employment / organisational
  - works_at
  - worked_at
  - employed_by
  - reports_to
  - manages
  - founded
  - invested_in
  - partners_with

  # Location / containment
  - lives_in
  - located_in
  - resides_in
  - visited
  - born_in
  - moved_to
  - from_country

  # Personal / family
  - related_to
  - married_to
  - partner_of
  - parent_of
  - child_of
  - sibling_of
  - friend_of
  - is_a
  - knows_for
  - married_for

  # Project / work artifacts
  - works_on
  - contributes_to
  - owns
  - maintains
  - uses
  - built_with
  - depends_on
  - supersedes
  - references
  - mentions
  - contains
  - created_by
  - gifted_by
  - helps_with
  - undergoing

  # Events / temporal
  - started_on
  - received_on
  - ended_on
  - scheduled_for
  - happened_at
  - achieved
  - took_place_in
  - participated_in
  - attended

  # Preferences
  - prefers
  - likes
  - dislikes
  - avoids
  - interested_in
  - motivated_by
  - makes_feel
  - reminds_of
  - symbolizes

  # Ownership / attributes
  - has
  - owns_pet_named
  - drives
  - reads
  - watches

aliases:
  # Alias → canonical. NORMALIZE walks this map before falling back to
  # embedding similarity.
  worksAt: works_at
  "works at": works_at
  workedAt: worked_at
  # `employed_by` and `works_at` have the same subject/object semantics in
  # Engram. Keep one canonical edge label so paraphrases can deduplicate.
  employedBy: works_at
  employed_by: works_at
  "employed by": works_at
  reportsTo: reports_to
  livesIn: lives_in
  "lives in": lives_in
  locatedIn: located_in
  marriedTo: married_to
  partnerOf: partner_of
  parentOf: parent_of
  childOf: child_of
  siblingOf: sibling_of
  friendOf: friend_of
  worksOn: works_on
  working_on: works_on
  "working on": works_on
  contributesTo: contributes_to
  dependsOn: depends_on
  startedOn: started_on
  endedOn: ended_on
  scheduledFor: scheduled_for
  happenedAt: happened_at
  tookPlaceIn: took_place_in
  took_part_in: participated_in
  "took part in": participated_in
  gifted_on: received_on
  given_by: gifted_by
  "given by": gifted_by
  gift_from: gifted_by
  stands_for: symbolizes
  "stands for": symbolizes
  reminder_of: reminds_of
  reminded_of: reminds_of
