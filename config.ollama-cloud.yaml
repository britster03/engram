# Engram config — Ollama Cloud overlay.
# Use: ENGRAM_CONFIG_PATH=./config.ollama-cloud.yaml python -m engram.cli smoke

api:
  host: "0.0.0.0"
  port: 8000
  api_key: ${ENGRAM_API_KEY}
  rate_limit_query_per_minute: 60
  rate_limit_ingest_per_minute: 600

gating:
  configuration: "dual"
  classifier_path: "./models/engram-gate-v1"
  embedding_model_path: "BAAI/bge-small-en-v1.5"
  classification_threshold: 0.3
  device: "cpu"
  max_batch_size: 32
  memory_hit_threshold: 0.75

core_model:
  provider: "ollama_cloud"
  model_path: "gpt-oss:20b"
  api_base: "https://ollama.com/api"
  api_key: ${OLLAMA_API_KEY}
  temperature: 0.1
  max_tokens: 2048
  timeout_seconds: 60
  min_request_interval_seconds: 3.2

frontier_llm:
  provider: "ollama_cloud"
  model_path: "gpt-oss:20b"
  api_base: "https://ollama.com/api"
  api_key: ${OLLAMA_API_KEY}
  temperature: 0.3
  max_tokens: 4096
  min_request_interval_seconds: 3.2

filesystem:
  data_dir: "./data/mem"
  create_dirs: true
  tree_display_max_tokens: 2048

knowledge_graph:
  backend: "neo4j"
  uri: "bolt://localhost:7687"
  writer_username: "neo4j"
  writer_password: ${NEO4J_ADMIN_PASSWORD}
  reader_username: "neo4j"
  reader_password: ${NEO4J_ADMIN_PASSWORD}
  l2_query_timeout_seconds: 5
  l4_query_timeout_seconds: 15
  max_hops: 4

event_ledger:
  backend: "sqlite"
  path: "./data/event_ledger.db"
  reconciliation_interval_seconds: 60
  ingest_worker_concurrency: 1

consolidation:
  poll_interval_seconds: 10
  max_concurrent_tasks: 4
  overview_max_tokens: 2048
  overview_debounce_seconds: 30
  manifest_update_delay_seconds: 5
  max_backlog: 10000

session_cache:
  backend: "redis"
  redis_url: "redis://localhost:6379"

retrieval:
  l0_skip: true
  max_reentries: 2
  max_depth: "L4"
  max_l1_vector_results: 30
  overview_budget_tokens: 6000
  full_doc_budget_tokens: 20000
  msc_compression_threshold: 0.8

decay:
  preset: "personal_conversation"
  schedule: "0 3 * * *"
  dormant_floor: 0.05

session:
  timeout_minutes: 30
  window_threshold_ratio: 0.4
  max_turns_before_window: 50
