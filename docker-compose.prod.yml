# Production overlay: app + backing services behind nginx TLS.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This file assumes you have a `.env.prod` with:
#   ENGRAM_API_KEY=...
#   OLLAMA_API_KEY=...
#   NEO4J_ADMIN_PASSWORD=...
#
# TLS certs must be placed at deploy/tls/{fullchain.pem,privkey.pem} (see
# deploy/nginx.conf). Use certbot or similar to obtain them.

services:
  engram:
    build:
      context: .
      dockerfile: Dockerfile
    image: engram:latest
    container_name: engram-app
    env_file:
      - .env.prod
    environment:
      ENGRAM_LOG_FORMAT: "json"
      ENGRAM_LOG_LEVEL: "INFO"
    volumes:
      - engram_data:/var/lib/engram
      - ./config.yaml:/etc/engram/config.yaml:ro
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/livez"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: engram-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      - engram
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: engram-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    depends_on:
      - engram

  grafana:
    image: grafana/grafana:11.2.0
    container_name: engram-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  engram_data:
  prometheus_data:
  grafana_data:
